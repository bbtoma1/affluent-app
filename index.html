<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6f8a">
<title>웅덩이 트레이더</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>웅덩이</h1>
  <span id="chip" class="chip">불러오는 중</span>
  <button id="refresh" class="icon" aria-label="새로고침">↻</button>
</header>
<div id="demo" class="banner" hidden>합성 데모 데이터입니다. 실제 시세가 아니므로 판단에 쓰지 마세요. 시세 수집(Actions)이 한 번 돌면 실제 데이터로 바뀝니다.</div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="화면">
  <button data-tab="today" aria-current="page">오늘</button>
  <button data-tab="stock">종목</button>
  <button data-tab="check">검증</button>
  <button data-tab="acct">내 계좌</button>
</nav>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
